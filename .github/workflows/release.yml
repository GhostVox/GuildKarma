name: Release

# Pushing a version tag (e.g. 1.3.0) runs the tests, then packages the addon and
# uploads it to CurseForge and GitHub Releases. The CurseForge project comes from
# X-Curse-Project-ID in the TOC, and game versions from its ## Interface line.
on:
  push:
    tags:
      - "*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
