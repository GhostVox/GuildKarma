name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Run end-to-end tests
        run: lua tests/run.lua
